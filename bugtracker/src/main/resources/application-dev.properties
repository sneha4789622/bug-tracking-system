# ============================================================
# DEV PROFILE — Local development configuration
# ============================================================

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/bugtracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=bugtrackeruser
spring.datasource.password=BugTracker@2024
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool ──────────────────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Mail ─────────────────────────────────────────────────────
app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@bugtracker.com

# ── File Upload ──────────────────────────────────────────────
app.upload.dir=uploads

# ── Logging ──────────────────────────────────────────────────
logging.level.com.bugtracker=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE