# ============================================================
# PRODUCTION PROFILE
# Active when: SPRING_PROFILES_ACTIVE=prod (set on Render)
# ALL sensitive values come from environment variables —
# never hardcode passwords in production config files.
# ============================================================

# ── Database ─────────────────────────────────────────────────
# ${DB_URL} reads the DB_URL environment variable set on Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool — optimized for production
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA ──────────────────────────────────────────────────────
# validate: only checks schema matches entities — does NOT modify
# Use 'update' if you want Hibernate to manage schema changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Thymeleaf ────────────────────────────────────────────────
# Enable caching in production for performance
spring.thymeleaf.cache=true

# ── Mail ─────────────────────────────────────────────────────
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@bugtracker.com}

# ── File Upload ──────────────────────────────────────────────
# /tmp is writable on Render's free tier
# Note: files are lost on restart with free tier (ephemeral storage)
# Use AWS S3 or Cloudinary for persistent file storage in production
app.upload.dir=/tmp/bugtracker-uploads

# ── Logging ──────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.bugtracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ── Security ─────────────────────────────────────────────────
# Require HTTPS in production
server.forward-headers-strategy=framework