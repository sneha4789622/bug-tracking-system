# ================================
# APPLICATION CONFIGURATION
# ================================
spring.application.name=Bug Tracking System

# ================================
# SERVER CONFIGURATION
# ================================
server.port=8081

# ================================
# DATABASE CONFIGURATION
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/bugtracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Girlchild12@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / HIBERNATE CONFIGURATION
# ================================
# Hibernate DDL auto: create, create-drop, validate, update, none
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (disable in production)
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect for MySQL 8

# ================================
# THYMELEAF CONFIGURATION
# ================================
# Disable caching during development (enable in production)
spring.thymeleaf.cache=false

# ================================
# LOGGING CONFIGURATION
# ================================
logging.level.org.springframework.security=DEBUG
logging.level.com.bugtracker=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ================================
# SPRING SECURITY (temporary - will configure properly later)
# ================================
# Disable security temporarily for initial setup
# spring.security.user.name=admin
# spring.security.user.password=admin

# Suppress favicon.ico 404 log spam
logging.level.org.springframework.web.servlet.resource=OFF

# ============================================================
# EMAIL CONFIGURATION (Mailtrap for development)
# Sign up free at https://mailtrap.io
# Copy your SMTP credentials from Mailtrap → Inboxes → SMTP Settings
# ============================================================
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=ad68feffaa014a
spring.mail.password=4583ad2320de88
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# From address shown in the email header
app.mail.from=noreply@bugtracker.com
app.mail.enabled=true

# ============================================================
# LOGGING
# ============================================================
# Console log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] \
  %-5level %logger{36} - %msg%n

# Log levels per package
logging.level.root=WARN
logging.level.com.bugtracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Write logs to a file (rotates daily, keeps 30 days)
logging.file.name=logs/bugtracker.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================
# Directory to store uploaded files (relative to project root)
app.upload.dir=uploads

# Spring multipart settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB