<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Bug Tracking System</title>
    <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css)"
          rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-card {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #dc3545;
            line-height: 1;
        }
    </style>
</head>
<body>
<div class="error-card">
    <!-- th:text replaces element content with the model variable -->
    <div class="error-code" th:text="${errorCode}">500</div>

    <h2 class="mt-3" th:text="${errorTitle}">Error</h2>

    <p class="text-muted" th:text="${errorMessage}">
        An error occurred.
    </p>

    <a href="/" class="btn btn-primary mt-3">Return to Home</a>
</div>
</body>
</html>
