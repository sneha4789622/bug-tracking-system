<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-md-10 main-content">

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="/dashboard">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a href="/projects">Projects</a>
                    </li>
                    <li class="breadcrumb-item active"
                        th:text="${project.name}">Project</li>
                </ol>
            </nav>

            <!-- Header Row -->
            <div class="d-flex justify-content-between
                        align-items-start mb-4">
                <div>
                    <h2 class="mb-1">
                        <i class="bi bi-folder me-2 text-primary"></i>
                        <span th:text="${project.name}"></span>
                    </h2>
                    <p class="text-muted mb-0"
                       th:text="${project.description
                                  ?: 'No description provided'}">
                    </p>
                </div>

                <div class="d-flex gap-2"
                     sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">
                    <a th:href="@{/projects/{id}/edit(id=${project.id})}"
                       class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </a>
                    <a th:href="@{/bugs/new(projectId=${project.id})}"
                       class="btn btn-danger btn-sm">
                        <i class="bi bi-bug me-1"></i>Report Bug
                    </a>
                </div>
            </div>

            <!-- Mini Stats Row -->
            <div class="row g-3 mb-4">

                <div class="col-md-3">
                    <div class="card text-center border-0
                                border-start border-primary border-4">
                        <div class="card-body py-3">
                            <div class="fs-3 fw-bold text-primary"
                                 th:text="${totalCount}">0</div>
                            <div class="text-muted small">Total Bugs</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center border-0
                                border-start border-danger border-4">
                        <div class="card-body py-3">
                            <div class="fs-3 fw-bold text-danger"
                                 th:text="${openCount}">0</div>
                            <div class="text-muted small">Open</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center border-0
                                border-start border-success border-4">
                        <div class="card-body py-3">
                            <div class="fs-3 fw-bold text-success"
                                 th:text="${resolvedCount}">0</div>
                            <div class="text-muted small">Resolved</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center border-0
                                border-start border-warning border-4">
                        <div class="card-body py-3">
                            <div class="fs-3 fw-bold text-warning"
                                 th:text="${totalCount - openCount - resolvedCount}">
                                0
                            </div>
                            <div class="text-muted small">In Testing</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Bug List for This Project -->
            <div class="card">
                <div class="card-header bg-white
                            d-flex justify-content-between
                            align-items-center">
                    <strong>
                        <i class="bi bi-bug me-2"></i>Bugs in this Project
                    </strong>
                    <a th:href="@{/bugs(projectId=${project.id})}"
                       class="btn btn-sm btn-outline-secondary">
                        View with filters
                    </a>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Severity</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Assignee</th>
                            <th>Comments</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="bug : ${bugs}">

                            <td class="text-muted small"
                                th:text="'#' + ${bug.id}"></td>

                            <td>
                                <a th:href="@{/bugs/{id}(id=${bug.id})}"
                                   th:text="${bug.title}"
                                   class="text-decoration-none
                                              fw-semibold">
                                </a>
                            </td>

                            <td>
                                    <span class="badge"
                                          th:classappend="'badge-severity-'
                                            + ${#strings.toLowerCase(bug.severity)}"
                                          th:text="${bug.severity.displayName}">
                                    </span>
                            </td>

                            <td>
                                    <span class="badge"
                                          th:classappend="'badge-severity-'
                                            + ${#strings.toLowerCase(bug.priority)}"
                                          th:text="${bug.priority.displayName}">
                                    </span>
                            </td>

                            <td>
                                    <span class="badge"
                                          th:classappend="'badge-status-'
                                            + ${#strings.toLowerCase(bug.status)}"
                                          th:text="${bug.status.displayName}">
                                    </span>
                            </td>

                            <td class="small"
                                th:text="${bug.assigneeName ?: 'Unassigned'}">
                            </td>

                            <td class="text-center">
                                    <span class="badge bg-light text-dark"
                                          th:text="${bug.commentCount}">
                                    </span>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(bugs)}">
                            <td colspan="7"
                                class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2">
                                </i>
                                No bugs reported yet.
                                <a th:href="@{/bugs/new(projectId=${project.id})}">
                                    Report the first bug
                                </a>.
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
