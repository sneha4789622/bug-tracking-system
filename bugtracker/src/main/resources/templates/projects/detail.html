<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-md-10 main-content">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center">
                    <a href="/projects" class="btn btn-outline-secondary me-3">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                    <h2 th:text="${project.name}">Project Name</h2>
                </div>
                <div>
                    <a th:href="@{/projects/{id}/edit(id=${project.id})}"
                       class="btn btn-primary me-2">
                        <i class="bi bi-pencil me-1"></i> Edit
                    </a>
                    <form th:action="@{/projects/{id}/delete(id=${project.id})}"
                          method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this project?')">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i> Delete
                        </button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Project Details</h5>
                    <hr>

                    <dl class="row">
                        <dt class="col-sm-3">Project ID</dt>
                        <dd class="col-sm-9" th:text="${project.id}">1</dd>

                        <dt class="col-sm-3">Name</dt>
                        <dd class="col-sm-9" th:text="${project.name}">Name</dd>

                        <dt class="col-sm-3">Description</dt>
                        <dd class="col-sm-9"
                            th:text="${project.description ?: 'No description provided'}">
                            Description
                        </dd>
                    </dl>
                </div>
            </div>

        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
