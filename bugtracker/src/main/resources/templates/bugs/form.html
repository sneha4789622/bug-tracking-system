<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-md-10 main-content">

            <div class="d-flex align-items-center mb-4">
                <a href="/bugs" class="btn btn-outline-secondary me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h2 th:text="${pageTitle}">Bug Form</h2>
            </div>

            <div class="card" style="max-width: 750px;">
                <div class="card-header bg-danger text-white fw-bold">
                    <i class="bi bi-bug me-2"></i>
                    <span th:text="${pageTitle}">Form</span>
                </div>
                <div class="card-body">

                    <form th:action="${bugDTO.id != null}
                                     ? @{/bugs/{id}(id=${bugDTO.id})}
                                     : @{/bugs}"
                          th:object="${bugDTO}"
                          method="post">

                        <!-- Row 1: Title -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Title <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   placeholder="Brief, descriptive title of the bug">
                            <div class="invalid-feedback"
                                 th:errors="*{title}">Title error</div>
                        </div>

                        <!-- Row 2: Description -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Description <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control"
                                      th:field="*{description}"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      rows="5"
                                      placeholder="Steps to reproduce:&#10;1. Go to...&#10;2. Click...&#10;&#10;Expected: ...&#10;Actual: ...">
                            </textarea>
                            <div class="invalid-feedback"
                                 th:errors="*{description}">Description error</div>
                        </div>

                        <!-- Row 3: Project | Severity | Priority -->
                        <div class="row g-3 mb-3">

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Project <span class="text-danger">*</span>
                                </label>
                                <select class="form-select"
                                        th:field="*{projectId}"
                                        th:classappend="${#fields.hasErrors('projectId')} ? 'is-invalid'">
                                    <option value="">-- Select Project --</option>
                                    <option th:each="project : ${allProjects}"
                                            th:value="${project.id}"
                                            th:text="${project.name}">
                                    </option>
                                </select>
                                <div class="invalid-feedback"
                                     th:errors="*{projectId}">Project error</div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Severity <span class="text-danger">*</span>
                                </label>
                                <select class="form-select"
                                        th:field="*{severity}"
                                        th:classappend="${#fields.hasErrors('severity')} ? 'is-invalid'">
                                    <option value="">-- Select Severity --</option>
                                    <option th:each="s : ${allSeverities}"
                                            th:value="${s}"
                                            th:text="${s.displayName}">
                                    </option>
                                </select>
                                <div class="invalid-feedback"
                                     th:errors="*{severity}">Severity error</div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Priority <span class="text-danger">*</span>
                                </label>
                                <select class="form-select"
                                        th:field="*{priority}"
                                        th:classappend="${#fields.hasErrors('priority')} ? 'is-invalid'">
                                    <option value="">-- Select Priority --</option>
                                    <option th:each="p : ${allPriorities}"
                                            th:value="${p}"
                                            th:text="${p.displayName}">
                                    </option>
                                </select>
                                <div class="invalid-feedback"
                                     th:errors="*{priority}">Priority error</div>
                            </div>

                        </div>

                        <!-- Row 4: Assign Developer (optional) -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Assign To (optional)
                            </label>
                            <select class="form-select"
                                    th:field="*{assigneeId}">
                                <option value="">-- Unassigned --</option>
                                <option th:each="dev : ${allDevelopers}"
                                        th:value="${dev.id}"
                                        th:text="${dev.fullName + ' (@' + dev.username + ')'}">
                                </option>
                            </select>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-danger">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${bugDTO.id != null}
                                               ? 'Update Bug'
                                               : 'Report Bug'">Save</span>
                            </button>
                            <a href="/bugs"
                               class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>

        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
