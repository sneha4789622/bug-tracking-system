<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <style>
        .sort-link { text-decoration: none; color: inherit; }
        .sort-link:hover { color: #0d6efd; }
        .sort-icon { font-size: 0.75rem; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-md-10 main-content">

            <!-- ═══ HEADER ═══════════════════════════════════════ -->
            <div class="d-flex justify-content-between
                        align-items-center mb-4">
                <div>
                    <h2>
                        <i class="bi bi-bug me-2 text-danger"></i>Bugs
                    </h2>
                    <p class="text-muted small mb-0">
                        <span th:text="${totalItems}">0</span> bugs found
                        <span th:if="${filter.hasActiveFilters()}"
                              class="text-primary fw-semibold">
                            (filtered)
                        </span>
                    </p>
                </div>
                <a href="/bugs/new" class="btn btn-danger">
                    <i class="bi bi-plus-circle me-1"></i>Report Bug
                </a>
            </div>

            <!-- ═══ FLASH MESSAGES ═══════════════════════════════ -->
            <div th:if="${successMessage}"
                 class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>

            <!-- ═══ FILTER PANEL ═════════════════════════════════ -->
            <div class="card mb-3">
                <div class="card-header bg-white">
                    <a class="text-decoration-none text-dark fw-bold"
                       data-bs-toggle="collapse"
                       href="#filterPanel">
                        <i class="bi bi-funnel me-2"></i>Filters
                        <span th:if="${filter.hasActiveFilters()}"
                              class="badge bg-primary ms-1">Active</span>
                        <i class="bi bi-chevron-down ms-2 small"></i>
                    </a>
                </div>
                <div class="collapse show" id="filterPanel">
                    <div class="card-body">
                        <form method="get" action="/bugs"
                              th:object="${filter}">

                            <!-- Preserve sort + size across filter submits -->
                            <input type="hidden" name="sortBy"
                                   th:value="${pageRequest.sortBy}">
                            <input type="hidden" name="sortDir"
                                   th:value="${pageRequest.sortDir}">
                            <input type="hidden" name="size"
                                   th:value="${pageRequest.size}">
                            <input type="hidden" name="page" value="1">

                            <div class="row g-2 align-items-end">

                                <div class="col-md-2">
                                    <label class="form-label small fw-semibold">
                                        Status
                                    </label>
                                    <select class="form-select form-select-sm"
                                            th:field="*{status}">
                                        <option value="">All</option>
                                        <option th:each="s : ${allStatuses}"
                                                th:value="${s}"
                                                th:text="${s.displayName}">
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-2">
                                    <label class="form-label small fw-semibold">
                                        Priority
                                    </label>
                                    <select class="form-select form-select-sm"
                                            th:field="*{priority}">
                                        <option value="">All</option>
                                        <option th:each="p : ${allPriorities}"
                                                th:value="${p}"
                                                th:text="${p.displayName}">
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-2">
                                    <label class="form-label small fw-semibold">
                                        Severity
                                    </label>
                                    <select class="form-select form-select-sm"
                                            th:field="*{severity}">
                                        <option value="">All</option>
                                        <option th:each="s : ${allSeverities}"
                                                th:value="${s}"
                                                th:text="${s.displayName}">
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-2">
                                    <label class="form-label small fw-semibold">
                                        Project
                                    </label>
                                    <select class="form-select form-select-sm"
                                            th:field="*{projectId}">
                                        <option value="">All</option>
                                        <option th:each="p : ${allProjects}"
                                                th:value="${p.id}"
                                                th:text="${p.name}">
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label small fw-semibold">
                                        Search
                                    </label>
                                    <input type="text"
                                           class="form-control form-control-sm"
                                           th:field="*{keyword}"
                                           placeholder="Title or description">
                                </div>

                                <div class="col-md-1 d-flex gap-1">
                                    <button type="submit"
                                            class="btn btn-primary btn-sm">
                                        <i class="bi bi-search"></i>
                                    </button>
                                    <a href="/bugs"
                                       class="btn btn-outline-secondary btn-sm"
                                       title="Clear filters">
                                        <i class="bi bi-x-lg"></i>
                                    </a>
                                </div>

                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ═══ BUG TABLE ════════════════════════════════════ -->
            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th style="width:65px">#</th>

                            <!-- Sortable: Title -->
                            <th>
                                <a class="sort-link"
                                   th:href="@{/bugs(
                                           status=${filter.status},
                                           priority=${filter.priority},
                                           severity=${filter.severity},
                                           projectId=${filter.projectId},
                                           keyword=${filter.keyword},
                                           sortBy='title',
                                           sortDir=${pageRequest.sortBy == 'title' ? pageRequest.toggleSortDir : 'asc'},
                                           size=${pageRequest.size},
                                           page=1)}">
                                    Title
                                    <i class="bi sort-icon"
                                       th:classappend="${pageRequest.sortBy == 'title'}
                                               ? (${pageRequest.sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down')
                                               : 'bi-arrow-down-up text-muted'">
                                    </i>
                                </a>
                            </th>

                            <th>Project</th>

                            <!-- Sortable: Severity -->
                            <th>
                                <a class="sort-link"
                                   th:href="@{/bugs(
                                           status=${filter.status},
                                           priority=${filter.priority},
                                           severity=${filter.severity},
                                           projectId=${filter.projectId},
                                           keyword=${filter.keyword},
                                           sortBy='severity',
                                           sortDir=${pageRequest.sortBy == 'severity' ? pageRequest.toggleSortDir : 'asc'},
                                           size=${pageRequest.size},
                                           page=1)}">
                                    Severity
                                    <i class="bi sort-icon"
                                       th:classappend="${pageRequest.sortBy == 'severity'}
                                               ? (${pageRequest.sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down')
                                               : 'bi-arrow-down-up text-muted'">
                                    </i>
                                </a>
                            </th>

                            <!-- Sortable: Priority -->
                            <th>
                                <a class="sort-link"
                                   th:href="@{/bugs(
                                           status=${filter.status},
                                           priority=${filter.priority},
                                           severity=${filter.severity},
                                           projectId=${filter.projectId},
                                           keyword=${filter.keyword},
                                           sortBy='priority',
                                           sortDir=${pageRequest.sortBy == 'priority' ? pageRequest.toggleSortDir : 'asc'},
                                           size=${pageRequest.size},
                                           page=1)}">
                                    Priority
                                    <i class="bi sort-icon"
                                       th:classappend="${pageRequest.sortBy == 'priority'}
                                               ? (${pageRequest.sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down')
                                               : 'bi-arrow-down-up text-muted'">
                                    </i>
                                </a>
                            </th>

                            <!-- Sortable: Status -->
                            <th>
                                <a class="sort-link"
                                   th:href="@{/bugs(
                                           status=${filter.status},
                                           priority=${filter.priority},
                                           severity=${filter.severity},
                                           projectId=${filter.projectId},
                                           keyword=${filter.keyword},
                                           sortBy='status',
                                           sortDir=${pageRequest.sortBy == 'status' ? pageRequest.toggleSortDir : 'asc'},
                                           size=${pageRequest.size},
                                           page=1)}">
                                    Status
                                    <i class="bi sort-icon"
                                       th:classappend="${pageRequest.sortBy == 'status'}
                                               ? (${pageRequest.sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down')
                                               : 'bi-arrow-down-up text-muted'">
                                    </i>
                                </a>
                            </th>

                            <th>Assignee</th>

                            <th style="width:60px">
                                <i class="bi bi-chat-dots"
                                   title="Comments"></i>
                            </th>

                            <!-- Sortable: Created -->
                            <th>
                                <a class="sort-link"
                                   th:href="@{/bugs(
                                           status=${filter.status},
                                           priority=${filter.priority},
                                           severity=${filter.severity},
                                           projectId=${filter.projectId},
                                           keyword=${filter.keyword},
                                           sortBy='createdAt',
                                           sortDir=${pageRequest.sortBy == 'createdAt' ? pageRequest.toggleSortDir : 'desc'},
                                           size=${pageRequest.size},
                                           page=1)}">
                                    Created
                                    <i class="bi sort-icon"
                                       th:classappend="${pageRequest.sortBy == 'createdAt'}
                                               ? (${pageRequest.sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down')
                                               : 'bi-arrow-down-up text-muted'">
                                    </i>
                                </a>
                            </th>

                            <th style="width:80px">Actions</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="bug : ${bugs}">

                            <td class="text-muted small align-middle"
                                th:text="'#' + ${bug.id}">
                            </td>

                            <td class="align-middle">
                                <a th:href="@{/bugs/{id}(id=${bug.id})}"
                                   th:text="${bug.title}"
                                   class="text-decoration-none fw-semibold">
                                </a>
                            </td>

                            <td class="align-middle">
                                    <span class="badge bg-secondary"
                                          th:text="${bug.projectName}">
                                    </span>
                            </td>

                            <td class="align-middle">
                                    <span class="badge"
                                          th:classappend="'badge-severity-' + ${#strings.toLowerCase(bug.severity)}"
                                          th:text="${bug.severity.displayName}">
                                    </span>
                            </td>

                            <td class="align-middle">
                                    <span class="badge"
                                          th:classappend="'badge-severity-' + ${#strings.toLowerCase(bug.priority)}"
                                          th:text="${bug.priority.displayName}">
                                    </span>
                            </td>

                            <td class="align-middle">
                                    <span class="badge"
                                          th:classappend="'badge-status-' + ${#strings.toLowerCase(bug.status)}"
                                          th:text="${bug.status.displayName}">
                                    </span>
                            </td>

                            <td class="align-middle small"
                                th:text="${bug.assigneeName ?: 'Unassigned'}">
                            </td>

                            <td class="align-middle text-center">
                                    <span class="badge bg-light text-dark"
                                          th:text="${bug.commentCount}">
                                    </span>
                            </td>

                            <td class="align-middle small text-muted"
                                th:text="${bug.createdAt != null}
                                             ? ${#temporals.format(bug.createdAt, 'MMM d')}
                                             : '-'">
                            </td>

                            <td class="align-middle">
                                <a th:href="@{/bugs/{id}(id=${bug.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>

                        </tr>

                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(bugs)}">
                            <td colspan="10"
                                class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No bugs found.
                                <a th:if="${filter.hasActiveFilters()}"
                                   href="/bugs">Clear filters</a>
                                <a th:if="${!filter.hasActiveFilters()}"
                                   href="/bugs/new">Report the first bug</a>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>

                <!-- ═══ PAGINATION FOOTER ════════════════════════ -->
                <div class="card-footer bg-white py-3"
                     th:if="${totalPages > 0}">

                    <div class="d-flex justify-content-between
                                align-items-center flex-wrap gap-2">

                        <!-- Left: Rows per page -->
                        <div class="d-flex align-items-center gap-2">
                            <span class="small text-muted">Rows per page:</span>
                            <form method="get" action="/bugs">
                                <input type="hidden" name="status"
                                       th:value="${filter.status}">
                                <input type="hidden" name="priority"
                                       th:value="${filter.priority}">
                                <input type="hidden" name="severity"
                                       th:value="${filter.severity}">
                                <input type="hidden" name="projectId"
                                       th:value="${filter.projectId}">
                                <input type="hidden" name="keyword"
                                       th:value="${filter.keyword}">
                                <input type="hidden" name="sortBy"
                                       th:value="${pageRequest.sortBy}">
                                <input type="hidden" name="sortDir"
                                       th:value="${pageRequest.sortDir}">
                                <input type="hidden" name="page" value="1">
                                <select name="size"
                                        class="form-select form-select-sm"
                                        style="width: auto;"
                                        onchange="this.form.submit()">
                                    <option value="10"
                                            th:selected="${pageRequest.size == 10}">10</option>
                                    <option value="25"
                                            th:selected="${pageRequest.size == 25}">25</option>
                                    <option value="50"
                                            th:selected="${pageRequest.size == 50}">50</option>
                                </select>
                            </form>
                        </div>

                        <!-- Center: Page info -->
                        <span class="small text-muted">
                            Page <strong th:text="${currentPage}">1</strong>
                            of <strong th:text="${totalPages}">1</strong>
                            &nbsp;
                            (<span th:text="${totalItems}">0</span> total)
                        </span>

                        <!-- Right: Navigation buttons -->
                        <div class="d-flex align-items-center gap-1">

                            <!-- PREVIOUS -->
                            <a th:href="@{/bugs(
                                   status=${filter.status},
                                   priority=${filter.priority},
                                   severity=${filter.severity},
                                   projectId=${filter.projectId},
                                   keyword=${filter.keyword},
                                   sortBy=${pageRequest.sortBy},
                                   sortDir=${pageRequest.sortDir},
                                   size=${pageRequest.size},
                                   page=${currentPage - 1})}"
                               class="btn btn-sm btn-outline-secondary"
                               th:classappend="${currentPage <= 1} ? 'disabled pe-none'">
                                <i class="bi bi-chevron-left"></i> Prev
                            </a>

                            <!-- PAGE NUMBER BUTTONS -->
                            <!--
                                Simple approach: use th:each with
                                #numbers.sequence(start, end).
                                start = max(1, currentPage-2)
                                end   = min(totalPages, currentPage+2)

                                We compute these in the controller
                                as pageStart and pageEnd model attributes.
                            -->
                            <th:block th:each="i : ${#numbers.sequence(pageStart, pageEnd)}">
                                <a th:text="${i}"
                                   class="btn btn-sm"
                                   th:classappend="${i == currentPage}
                                                   ? 'btn-primary'
                                                   : 'btn-outline-secondary'"
                                   th:href="@{/bugs(
                                       status=${filter.status},
                                       priority=${filter.priority},
                                       severity=${filter.severity},
                                       projectId=${filter.projectId},
                                       keyword=${filter.keyword},
                                       sortBy=${pageRequest.sortBy},
                                       sortDir=${pageRequest.sortDir},
                                       size=${pageRequest.size},
                                       page=${i})}">
                                </a>
                            </th:block>

                            <!-- NEXT -->
                            <a th:href="@{/bugs(
                                   status=${filter.status},
                                   priority=${filter.priority},
                                   severity=${filter.severity},
                                   projectId=${filter.projectId},
                                   keyword=${filter.keyword},
                                   sortBy=${pageRequest.sortBy},
                                   sortDir=${pageRequest.sortDir},
                                   size=${pageRequest.size},
                                   page=${currentPage + 1})}"
                               class="btn btn-sm btn-outline-secondary"
                               th:classappend="${currentPage >= totalPages} ? 'disabled pe-none'">
                                Next <i class="bi bi-chevron-right"></i>
                            </a>

                        </div>
                    </div>
                </div>
                <!-- ═══ END PAGINATION ═══════════════════════════ -->

            </div>

        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
