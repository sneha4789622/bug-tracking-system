<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-md-10 main-content">

            <!-- Welcome Message -->
            <div class="mb-4">
                <h2>
                    <i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard
                </h2>
                <p class="text-muted">
                    Welcome back,
                    <!--
                        Two ways to show the current user's name:
                        1. From the model (passed by controller via @AuthenticationPrincipal)
                        2. Via sec:authentication (directly from Security context)
                    -->
                    <strong th:text="${currentUser != null}
                                         ? ${currentUser.fullName}
                                         : 'User'">User</strong>
                </p>
            </div>

            <!-- Stats Row -->
            <div class="row g-4 mb-4">

                <div class="col-md-3">
                    <div class="card border-start border-primary border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small fw-semibold">
                                        TOTAL PROJECTS
                                    </div>
                                    <div class="fs-2 fw-bold text-primary"
                                         th:text="${totalProjects}">0</div>
                                </div>
                                <i class="bi bi-folder fs-1 text-primary opacity-25"></i>
                            </div>
                            <a href="/projects"
                               class="text-decoration-none small text-primary">
                                View all projects →
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-start border-warning border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small fw-semibold">TOTAL BUGS</div>
                                    <div class="fs-2 fw-bold text-warning"
                                         th:text="${totalBugs}">0</div>
                                </div>
                                <i class="bi bi-bug fs-1 text-warning opacity-25"></i>
                            </div>
                            <a href="/bugs"
                               class="text-decoration-none small text-warning">
                                View all bugs →
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-start border-danger border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small fw-semibold">OPEN BUGS</div>
                                    <div class="fs-2 fw-bold text-danger"
                                         th:text="${openBugs}">0</div>
                                </div>
                                <i class="bi bi-exclamation-triangle fs-1 text-danger opacity-25"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-start border-success border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small fw-semibold">RESOLVED</div>
                                    <div class="fs-2 fw-bold text-success"
                                         th:text="${resolvedBugs}">0</div>
                                </div>
                                <i class="bi bi-check-circle fs-1 text-success opacity-25"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Role-Based Quick Actions -->
            <div class="card">
                <div class="card-header bg-white fw-bold">Quick Actions</div>
                <div class="card-body">

                    <!-- Actions visible to ADMIN and PROJECT_MANAGER only -->
                    <span sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">
                            <a href="/projects/new" class="btn btn-outline-primary me-2">
                                <i class="bi bi-folder-plus me-1"></i>New Project
                            </a>
                        </span>

                    <!-- Actions visible to all authenticated users -->
                    <a href="/bugs/new" class="btn btn-outline-danger me-2">
                        <i class="bi bi-bug me-1"></i>Report Bug
                    </a>
                    <a href="/projects" class="btn btn-outline-secondary me-2">
                        <i class="bi bi-folder me-1"></i>View Projects
                    </a>
                    <a href="/bugs" class="btn btn-outline-secondary">
                        <i class="bi bi-list me-1"></i>View Bugs
                    </a>

                </div>
            </div>

        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
