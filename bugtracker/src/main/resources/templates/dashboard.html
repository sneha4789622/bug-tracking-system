<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-md-10 main-content">

            <!-- Welcome Banner -->
            <div class="card mb-4 border-0 text-white"
                 style="background: linear-gradient(135deg,
                        #1a1a2e 0%, #0f3460 100%);">
                <div class="card-body py-4">
                    <div class="row align-items-center">
                        <div class="col">
                            <h3 class="mb-1">
                                Welcome back,
                                <span th:text="${currentUser != null}
                                               ? ${currentUser.fullName}
                                               : 'User'">
                                </span>!
                            </h3>
                            <p class="mb-0 opacity-75">
                                <span sec:authorize="hasRole('ADMIN')">
                                    System Administrator
                                </span>
                                <span sec:authorize="hasRole('PROJECT_MANAGER')">
                                    Project Manager
                                </span>
                                <span sec:authorize="hasRole('DEVELOPER')">
                                    Developer
                                </span>
                            </p>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-bug-fill"
                               style="font-size:4rem;opacity:0.2"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Global Stats (Admin + PM) -->
            <div sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">

                <h5 class="text-muted mb-3 fw-semibold">
                    SYSTEM OVERVIEW
                </h5>

                <div class="row g-4 mb-4">

                    <div class="col-md-3">
                        <div class="card border-start
                                    border-primary border-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between
                                            align-items-center">
                                    <div>
                                        <div class="text-muted small
                                                    fw-semibold">
                                            TOTAL PROJECTS
                                        </div>
                                        <div class="fs-2 fw-bold text-primary"
                                             th:text="${totalProjects}">
                                            0
                                        </div>
                                    </div>
                                    <i class="bi bi-folder fs-1
                                              text-primary opacity-25">
                                    </i>
                                </div>
                                <a href="/projects"
                                   class="text-primary
                                          text-decoration-none small">
                                    View all →
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card border-start
                                    border-warning border-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between
                                            align-items-center">
                                    <div>
                                        <div class="text-muted small
                                                    fw-semibold">
                                            TOTAL BUGS
                                        </div>
                                        <div class="fs-2 fw-bold text-warning"
                                             th:text="${totalBugs}">
                                            0
                                        </div>
                                    </div>
                                    <i class="bi bi-bug fs-1
                                              text-warning opacity-25">
                                    </i>
                                </div>
                                <a href="/bugs"
                                   class="text-warning
                                          text-decoration-none small">
                                    View all →
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card border-start
                                    border-danger border-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between
                                            align-items-center">
                                    <div>
                                        <div class="text-muted small
                                                    fw-semibold">
                                            OPEN BUGS
                                        </div>
                                        <div class="fs-2 fw-bold text-danger"
                                             th:text="${openBugs}">
                                            0
                                        </div>
                                    </div>
                                    <i class="bi bi-exclamation-triangle
                                              fs-1 text-danger opacity-25">
                                    </i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card border-start
                                    border-success border-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between
                                            align-items-center">
                                    <div>
                                        <div class="text-muted small
                                                    fw-semibold">
                                            RESOLVED
                                        </div>
                                        <div class="fs-2 fw-bold text-success"
                                             th:text="${resolvedBugs}">
                                            0
                                        </div>
                                    </div>
                                    <i class="bi bi-check-circle fs-1
                                              text-success opacity-25">
                                    </i>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Developer: My Assigned Bugs -->
            <div sec:authorize="hasRole('DEVELOPER')">

                <h5 class="text-muted mb-3 fw-semibold">
                    MY ASSIGNED BUGS
                </h5>

                <div class="card mb-4">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Title</th>
                                <th>Project</th>
                                <th>Priority</th>
                                <th>Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="bug : ${myBugs}">
                                <td class="text-muted small"
                                    th:text="'#' + ${bug.id}">
                                </td>
                                <td>
                                    <a th:href="@{/bugs/{id}(id=${bug.id})}"
                                       th:text="${bug.title}"
                                       class="text-decoration-none
                                                  fw-semibold">
                                    </a>
                                </td>
                                <td>
                                        <span class="badge bg-secondary"
                                              th:text="${bug.projectName}">
                                        </span>
                                </td>
                                <td>
                                        <span class="badge"
                                              th:classappend="'badge-severity-'
                                                + ${#strings.toLowerCase(
                                                   bug.priority)}"
                                              th:text="${bug.priority
                                                         .displayName}">
                                        </span>
                                </td>
                                <td>
                                        <span class="badge"
                                              th:classappend="'badge-status-'
                                                + ${#strings.toLowerCase(
                                                   bug.status)}"
                                              th:text="${bug.status
                                                         .displayName}">
                                        </span>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(myBugs)}">
                                <td colspan="5"
                                    class="text-center
                                               text-muted py-4">
                                    <i class="bi bi-check2-all
                                                  fs-3 d-block
                                                  text-success mb-2">
                                    </i>
                                    No bugs assigned to you.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- Quick Actions -->
            <div class="card">
                <div class="card-header bg-white fw-bold">
                    Quick Actions
                </div>
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2">

                        <span sec:authorize="
                            hasAnyRole('ADMIN','PROJECT_MANAGER')">
                            <a href="/projects/new"
                               class="btn btn-outline-primary">
                                <i class="bi bi-folder-plus me-1"></i>
                                New Project
                            </a>
                        </span>

                        <a href="/bugs/new"
                           class="btn btn-outline-danger">
                            <i class="bi bi-bug me-1"></i>
                            Report Bug
                        </a>

                        <a href="/projects"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-folder me-1"></i>
                            Projects
                        </a>

                        <a href="/bugs"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-list-ul me-1"></i>
                            All Bugs
                        </a>

                        <span sec:authorize="hasRole('ADMIN')">
                            <a href="/admin/users"
                               class="btn btn-outline-dark">
                                <i class="bi bi-people me-1"></i>
                                Manage Users
                            </a>
                        </span>

                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
