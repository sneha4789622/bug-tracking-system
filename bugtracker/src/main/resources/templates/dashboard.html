<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-md-10 main-content">

            <h2 class="mb-4">
                <i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard
            </h2>

            <!-- Statistics Cards Row -->
            <div class="row g-4 mb-4">

                <!-- Total Projects Card -->
                <div class="col-md-3">
                    <div class="card border-start border-primary border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small">Total Projects</div>
                                    <div class="fs-2 fw-bold text-primary"
                                         th:text="${totalProjects}">0</div>
                                </div>
                                <i class="bi bi-folder fs-1 text-primary opacity-25"></i>
                            </div>
                            <a href="/projects" class="text-decoration-none small">
                                View all →
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Total Bugs Card -->
                <div class="col-md-3">
                    <div class="card border-start border-warning border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small">Total Bugs</div>
                                    <div class="fs-2 fw-bold text-warning"
                                         th:text="${totalBugs}">0</div>
                                </div>
                                <i class="bi bi-bug fs-1 text-warning opacity-25"></i>
                            </div>
                            <a href="/bugs" class="text-decoration-none small">
                                View all →
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Open Bugs Card -->
                <div class="col-md-3">
                    <div class="card border-start border-danger border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small">Open Bugs</div>
                                    <div class="fs-2 fw-bold text-danger"
                                         th:text="${openBugs}">0</div>
                                </div>
                                <i class="bi bi-exclamation-triangle fs-1 text-danger opacity-25"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resolved Bugs Card -->
                <div class="col-md-3">
                    <div class="card border-start border-success border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small">Resolved Bugs</div>
                                    <div class="fs-2 fw-bold text-success"
                                         th:text="${resolvedBugs}">0</div>
                                </div>
                                <i class="bi bi-check-circle fs-1 text-success opacity-25"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Quick Actions -->
            <div class="card">
                <div class="card-header bg-white"><strong>Quick Actions</strong></div>
                <div class="card-body">
                    <a href="/projects/new" class="btn btn-outline-primary me-2">
                        <i class="bi bi-folder-plus me-1"></i> New Project
                    </a>
                    <a href="/bugs/new" class="btn btn-outline-danger me-2">
                        <i class="bi bi-bug me-1"></i> Report Bug
                    </a>
                    <a href="/projects" class="btn btn-outline-secondary">
                        <i class="bi bi-list me-1"></i> View Projects
                    </a>
                </div>
            </div>

        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
