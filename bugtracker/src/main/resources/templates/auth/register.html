<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Bug Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
        rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .register-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .register-header .logo { font-size: 2rem; color: #dc3545; }
    .register-header h2 { color: #1a1a2e; font-weight: 700; }
    .form-control:focus {
      border-color: #0f3460;
      box-shadow: 0 0 0 0.2rem rgba(15,52,96,0.2);
    }
    .btn-register {
      background: linear-gradient(135deg, #0f3460, #16213e);
      border: none;
      color: white;
      width: 100%;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
    }
    .btn-register:hover { opacity: 0.9; color: white; }
    .password-strength {
      height: 4px;
      border-radius: 2px;
      transition: all 0.3s;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="register-card">

  <div class="register-header">
    <div class="logo"><i class="bi bi-bug-fill"></i></div>
    <h2>Create Account</h2>
    <p class="text-muted">Join the Bug Tracking System</p>
  </div>

  <!-- Business Rule Error (e.g. username taken) -->
  <div th:if="${errorMessage}"
       class="alert alert-danger d-flex align-items-center mb-3">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="${errorMessage}">Error</span>
  </div>

  <!--
      th:action adds the CSRF token automatically.
      th:object binds the form to registrationDTO from the model.
  -->
  <form th:action="@{/auth/register}"
        th:object="${registrationDTO}"
        method="post">

    <!-- Full Name -->
    <div class="mb-3">
      <label class="form-label fw-semibold">
        Full Name <span class="text-danger">*</span>
      </label>
      <input type="text"
             class="form-control"
             th:field="*{fullName}"
             th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
             placeholder="John Smith">
      <div class="invalid-feedback" th:errors="*{fullName}">Name error</div>
    </div>

    <!-- Username -->
    <div class="mb-3">
      <label class="form-label fw-semibold">
        Username <span class="text-danger">*</span>
      </label>
      <input type="text"
             class="form-control"
             th:field="*{username}"
             th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
             placeholder="johnsmith"
             autocomplete="username">
      <div class="invalid-feedback" th:errors="*{username}">Username error</div>
      <div class="form-text">3–50 characters. Used to log in.</div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label fw-semibold">
        Email Address <span class="text-danger">*</span>
      </label>
      <input type="email"
             class="form-control"
             th:field="*{email}"
             th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
             placeholder="john@example.com"
             autocomplete="email">
      <div class="invalid-feedback" th:errors="*{email}">Email error</div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label class="form-label fw-semibold">
        Password <span class="text-danger">*</span>
      </label>
      <input type="password"
             class="form-control"
             th:field="*{password}"
             th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
             id="passwordInput"
             placeholder="Minimum 8 characters"
             autocomplete="new-password">
      <div class="invalid-feedback" th:errors="*{password}">Password error</div>
      <!-- Visual password strength bar (driven by JS below) -->
      <div class="password-strength bg-secondary mt-2" id="strengthBar"></div>
    </div>

    <!-- Confirm Password -->
    <div class="mb-4">
      <label class="form-label fw-semibold">
        Confirm Password <span class="text-danger">*</span>
      </label>
      <input type="password"
             class="form-control"
             th:field="*{confirmPassword}"
             th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
             placeholder="Re-enter your password"
             autocomplete="new-password">
      <div class="invalid-feedback" th:errors="*{confirmPassword}">
        Confirm password error
      </div>
    </div>

    <button type="submit" class="btn btn-register">
      <i class="bi bi-person-check me-2"></i>Create Account
    </button>

  </form>

  <div class="text-center mt-3">
    <span class="text-muted">Already have an account?</span>
    <a href="/auth/login" class="ms-1 fw-semibold text-decoration-none">Sign in</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
<script>
  // Simple password strength indicator
  const passwordInput = document.getElementById('passwordInput');
  const strengthBar   = document.getElementById('strengthBar');

  passwordInput.addEventListener('input', function() {
    const val = this.value;
    let strength = 0;

    if (val.length >= 8)                        strength++;
    if (/[A-Z]/.test(val))                      strength++;
    if (/[0-9]/.test(val))                      strength++;
    if (/[^A-Za-z0-9]/.test(val))              strength++;

    const colors = ['#dc3545', '#fd7e14', '#ffc107', '#198754'];
    const widths = ['25%', '50%', '75%', '100%'];

    strengthBar.style.width       = strength > 0 ? widths[strength - 1] : '0';
    strengthBar.style.background  = strength > 0 ? colors[strength - 1] : '';
  });
</script>
</body>
</html>
