<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bug Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header .logo {
            font-size: 2.5rem;
            color: #dc3545;
        }
        .login-header h2 {
            color: #1a1a2e;
            font-weight: 700;
            margin-top: 8px;
        }
        .login-header p {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #0f3460;
            box-shadow: 0 0 0 0.2rem rgba(15,52,96,0.2);
        }
        .btn-login {
            background: linear-gradient(135deg, #0f3460, #16213e);
            border: none;
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.9; color: white; }
        .divider {
            text-align: center;
            position: relative;
            margin: 20px 0;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #dee2e6;
        }
        .divider span {
            background: white;
            padding: 0 12px;
            color: #6c757d;
            font-size: 0.85rem;
            position: relative;
        }
    </style>
</head>
<body>

<div class="login-card">

    <!-- Header -->
    <div class="login-header">
        <div class="logo"><i class="bi bi-bug-fill"></i></div>
        <h2>Bug Tracker</h2>
        <p>Sign in to your account</p>
    </div>

    <!--
        Alert: Login Error
        th:if="${errorMessage}" — only shown when errorMessage exists in model
    -->
    <div th:if="${errorMessage}"
         class="alert alert-danger d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Error</span>
    </div>

    <!-- Alert: Logout Success -->
    <div th:if="${successMessage}"
         class="alert alert-success d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Success</span>
    </div>

    <!-- Alert: Session Expired -->
    <div th:if="${warningMessage}"
         class="alert alert-warning d-flex align-items-center" role="alert">
        <i class="bi bi-clock-fill me-2"></i>
        <span th:text="${warningMessage}">Warning</span>
    </div>

    <!--
        Login Form.

        CRITICAL: th:action="@{/auth/login}" adds the CSRF token
        automatically. Without th:action (using plain action="/auth/login"),
        the CSRF token is NOT added and Spring Security will reject
        the POST with HTTP 403 Forbidden.

        method="post" — login must always be POST, never GET.
        (GET requests would put the password in the URL and browser history)
    -->
    <form th:action="@{/auth/login}" method="post">

        <!-- Username Field -->
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>
                <!--
                    name="username" must match the usernameParameter
                    configured in SecurityConfig.formLogin().
                    Spring Security reads this field by name.
                -->
                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>
            </div>
        </div>

        <!-- Password Field -->
        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <!--
                    name="password" must match the passwordParameter
                    configured in SecurityConfig.formLogin().
                -->
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>

    </form>

    <div class="divider"><span>New to Bug Tracker?</span></div>

    <div class="text-center">
        <a href="/auth/register" class="btn btn-outline-secondary w-100">
            <i class="bi bi-person-plus me-2"></i>Create an Account
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
