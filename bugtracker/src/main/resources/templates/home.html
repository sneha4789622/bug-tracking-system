<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Bug Tracking System</title>
    <!-- Bootstrap CSS CDN -->
    <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css)"
          rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        .welcome-card h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .status-badge {
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="welcome-card">
    <h1 th:text="${title}">Title</h1>
    <p class="lead" th:text="${message}">Message</p>
    <span class="status-badge">✓ Application Running</span>

    <hr class="my-4">

    <div class="text-muted">
        <small>
            <strong>Technology Stack:</strong><br>
            Spring Boot 3.3 | Java 21 | MySQL 8 | Thymeleaf | Bootstrap 5
        </small>
    </div>
</div>

<!-- Bootstrap JS CDN -->
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js)">
</script>
</body>
</html>
