# ============================================================
# TEST PROFILE
# ============================================================

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:bugtracker_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# ── Mail: provide dummy values so context loads ──────────────
# The JavaMailSender bean is mocked in the test class,
# but Spring still needs these properties to not fail
# during auto-configuration property binding.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Disable our custom mail logic
app.mail.enabled=false
app.upload.dir=uploads-test

# Logging — suppress noise during tests
logging.level.root=WARN
logging.level.com.bugtracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN